---
# Create user and copy credentials to the other servers
- name: Create a slurm user
  ansible.builtin.user:
    name: slurm
    comment: Slurm User
    shell: /bin/no-login

- name: Ensure Slurm configuration directory exists
  ansible.builtin.file:
    path: /etc/slurm-llnl
    state: directory
    mode: "0755"

- name: Install Slurm controller and necessary packages
  ansible.builtin.apt:
    name:
      - slurm
      - slurmctld
      - slurmd
      - munge
      - slurm-wlm
    state: present

- name: Configure Slurm
  ansible.builtin.template:
    src: slurm.conf.j2
    dest: /etc/slurm-llnl/slurm.conf
  notify: restart slurm

- name: Start and enable Slurm services
  ansible.builtin.systemd:
    name: slurmctld
    state: started
    enabled: true