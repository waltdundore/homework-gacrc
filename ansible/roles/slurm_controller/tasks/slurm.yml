---
- name: Ensure group 'slurm' exists with correct gid
  ansible.builtin.group:
    name: slurm
    state: present
    gid: 1002

- name: Add the user 'slurm' with specific UID
  ansible.builtin.user:
    name: slurm
    comment: slurm application user
    uid: 1002
    group: slurm
    shell: /bin/no-login

- name: Creates directory
  ansible.builtin.file:
    path: /home/slurm/.ssh
    state: directory
    owner: slurm
    group: slurm
    mode: "0700"

- name: Copy ssh config into place for slurm
  ansible.builtin.template:
    src: config.j2
    dest: /home/slurm/.ssh/config
    owner: slurm
    group: slurm
    mode: "0600"
    backup: true

- name: Ensure Slurm var directory exists
  ansible.builtin.file:
    path:
      - /var/slurmctld
    state: directory
    owner: slurm
    group: slurm
    mode: 0755

- name: Ensure Slurm spool directory exists
  ansible.builtin.file:
    path:
      - /var/slurmctld/spool
    state: directory
    owner: slurm
    group: slurm
    mode: 0755

- name: Install Slurm controller and necessary packages
  ansible.builtin.apt:
    name:
      - slurm
      - slurmctld
      - slurmd
      - munge
      - slurm-wlm
    state: present

- name: Configure Slurm
  ansible.builtin.template:
    src: slurm.conf.j2
    dest: /etc/slurm/slurm.conf
  notify: restart slurm

- name: Start and enable Slurm services
  ansible.builtin.systemd:
    name: slurmctld
    state: started
    enabled: true
