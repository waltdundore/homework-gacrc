---
- name: Ensure group 'slurm' exists with correct gid
  ansible.builtin.group:
    name: slurm
    state: present
    gid: 1002
- name: Add the user 'slurm' with specific UID
  ansible.builtin.user:
    name: slurm
    comment: slurm application user
    uid: 1002
    group: slurm

- name: Create Slurm directory if it does not exist
  file:
    path: /slurmctld
    state: directory
    mode: "0755"
- name: Create Slurm spool directory if it does not exist
  file:
    path: /slurmctld/spool
    state: directory
    mode: "0755"
- name: Ensure /slurmctld ownership and permissions
  ansible.builtin.file:
    path: /slurmctld
    state: directory
    owner: slurm
    group: slurm
    mode: "0755"
- name: Ensure /slurmctld/spool ownership and permissions
  ansible.builtin.file:
    path: /slurmctld/spool
    state: directory
    owner: slurm
    group: slurm
    mode: "0755"
- name: Ensure /var/log/slurm/ ownership and permissions
  ansible.builtin.file:
    path: /var/log/slurm/
    state: directory
    owner: root
    group: slurm
    mode: "0775"

- name: Ensure /etc/slurm ownership and permissions
  ansible.builtin.file:
    path: /etc/slurm/
    state: directory
    owner: root
    group: slurm
    mode: "0775"

- name: Configure Slurm
  ansible.builtin.template:
    src: slurm.conf.j2
    dest: /etc/slurm/slurm.conf
