---
- name: SELinux
  ansible.posix.selinux:
    policy: targeted
    state: permissive

- name: Make sure yum-utils is installed
  ansible.builtin.dnf:
    name: yum-utils
    state: latest


- name: Execute the command to enable the CentOS CRB repository
  ansible.builtin.shell: dnf -y config-manager --set-enabled crb 2>&1 >/dev/null

- name: Install epel-release
  ansible.builtin.dnf:
    name:
      - epel-release
    state: present


- name: Copy a new sudoers file into place, after passing validation with visudo
  ansible.builtin.template:
    src: 10_vagrant.j2
    dest: /etc/sudoers.d/10_vagrant
    validate: /usr/sbin/visudo -cf %s

  
