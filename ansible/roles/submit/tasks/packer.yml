    #Install Packer
    - name: Add Hashicorp repo
      ansible.builtin.yum_repository:
        name: hashicorp
        description: Hashicorp repo
        file: hashicorp
        baseurl: https://rpm.releases.hashicorp.com/RHEL/$releasever/$basearch/stable
        gpgcheck: yes
        gpgkey: https://rpm.releases.hashicorp.com/gpg
    - name: Install Packer
      ansible.builtin.dnf:
        name: 'packer'
        state: present
    