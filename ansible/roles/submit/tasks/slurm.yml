---
- name: Install and configure Slurm
  hosts: slurm_controller
  become: yes
  tasks:
    - name: Install Slurm controller and necessary packages
      apt:
        name:
          - slurm-wlm
          - slurm-wlm-basic-plugins
          - slurm-wlm-doc
        state: present

    - name: Configure Slurm
      template:
        src: slurm.conf.j2
        dest: /etc/slurm-llnl/slurm.conf
      notify: restart slurm

    - name: Start and enable Slurm services
      systemd:
        name: slurmctld
        state: started
        enabled: yes

  handlers:
    - name: restart slurm
      systemd:
        name: slurmctld
        state: restarted

- name: Install and configure Slurm on compute nodes
  hosts: compute_nodes
  become: yes
  tasks:
    - name: Install Slurm compute node packages
      apt:
        name:
          - slurm-wlm
          - slurm-wlm-basic-plugins
        state: present

    - name: Configure Slurm to point to the controller
      template:
        src: slurm.conf.j2
        dest: /etc/slurm-llnl/slurm.conf
      notify: restart slurm

    - name: Start and enable Slurm services
      systemd:
        name: slurmd
        state: started
        enabled: yes

  handlers:
    - name: restart slurm
      systemd:
        name: slurmd
        state: restarted
